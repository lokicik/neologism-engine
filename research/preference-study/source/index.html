<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preference study source</title>
    <link rel="stylesheet" href="./source.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">Research source · local only</p>
      <h1>Build the frozen name-pair study</h1>
      <p class="lede">Generates every pool twice, checks exact replay, then pairs mechanically equal candidates. No model or network request is used.</p>
      <button id="build" type="button">Build 30 brief pools</button>
      <p id="status" role="status">Ready.</p>
      <progress id="progress" max="30" value="0"></progress>
      <button id="download" type="button" disabled>Download source JSON</button>
      <pre id="summary" aria-live="polite"></pre>
    </main>
    <script type="module" src="./source.ts"></script>
  </body>
</html>
